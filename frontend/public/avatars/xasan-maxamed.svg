<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 34 176 205" width="240" height="280" role="img" aria-label="Illustrated portrait of Dr. Xasan Maxamed">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f6ff"/>
      <stop offset="1" stop-color="#c4d7f3"/>
    </linearGradient>
  </defs>
  <rect width="240" height="280" fill="url(#bg)"/>

  <!-- white coat -->
  <path d="M6 280 C6 222 54 200 120 200 C186 200 234 222 234 280 Z" fill="#ffffff"/>
  <path d="M6 280 C6 222 54 200 120 200 C186 200 234 222 234 280" fill="none" stroke="#d3e1f3" stroke-width="2"/>
  <!-- shirt + collar -->
  <path d="M90 203 L120 266 L150 203 Q120 216 90 203Z" fill="#0a2f63"/>
  <path d="M90 203 L108 280 M150 203 L132 280" stroke="#d3e1f3" stroke-width="2" fill="none"/>
  <!-- stethoscope -->
  <path d="M95 208 C84 248 108 268 120 268 C132 268 156 248 145 208" fill="none" stroke="#3b4252" stroke-width="5" stroke-linecap="round"/>
  <circle cx="120" cy="270" r="8" fill="#a3afc2" stroke="#3b4252" stroke-width="3"/>

  <!-- neck -->
  <path d="M102 168 L102 208 Q120 222 138 208 L138 168 Z" fill="#8f5a3c"/>

  <g transform="translate(0,14) translate(120,124) scale(1.12) translate(-120,-124)">
  <!-- ears -->
  <ellipse cx="81" cy="128" rx="6.5" ry="11" fill="#a06a48"/>
  <ellipse cx="159" cy="128" rx="6.5" ry="11" fill="#a06a48"/>
  <!-- head -->
  <ellipse cx="120" cy="124" rx="39" ry="47" fill="#a86f4b"/>
  <!-- hair -->
  <path d="M79 116 C74 62 166 62 161 116 C157 94 142 84 120 84 C98 84 83 94 79 116Z" fill="#16110d"/>
  <!-- beard -->
  <path d="M82 128 C81 178 159 178 158 128 C154 152 140 162 120 162 C100 162 86 152 82 128Z" fill="#1a1410"/>

  <!-- brows, eyes, glasses -->
  <path d="M94 110 Q104 105 114 110" fill="none" stroke="#16110d" stroke-width="3" stroke-linecap="round"/>
  <path d="M126 110 Q136 105 146 110" fill="none" stroke="#16110d" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="104" cy="124" rx="3.4" ry="4" fill="#1c1410"/>
  <ellipse cx="136" cy="124" rx="3.4" ry="4" fill="#1c1410"/>
  <circle cx="104" cy="124" r="12.5" fill="#ffffff" fill-opacity="0.18" stroke="#1f2937" stroke-width="3"/>
  <circle cx="136" cy="124" r="12.5" fill="#ffffff" fill-opacity="0.18" stroke="#1f2937" stroke-width="3"/>
  <path d="M116.5 122 Q120 118 123.5 122" fill="none" stroke="#1f2937" stroke-width="3"/>
  <path d="M91.5 122 L84 120 M148.5 122 L156 120" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
  <!-- nose + smile -->
  <path d="M120 128 Q115 140 121 142" fill="none" stroke="#7a4a30" stroke-width="2" stroke-linecap="round"/>
  <path d="M107 150 Q120 160 133 150" fill="none" stroke="#f0d2c3" stroke-width="3" stroke-linecap="round"/>
</g>
</svg>
